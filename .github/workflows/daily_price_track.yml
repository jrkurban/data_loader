# .github/workflows/daily_price_track.yml

name: 'Günlük Fiyat Takipçisi'

on:
  schedule:
    # Bu bir CRON zamanlamasıdır. "Her gün saat 05:00 UTC'de çalıştır" demek.
    # Bu saat, genellikle sunucuların en az yoğun olduğu zamana ayarlanır.
    - cron: '0 5 * * *' 
  
  # Manuel olarak da çalıştırabilmek için
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-daily-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Checkout Yap
        uses: actions/checkout@v4
        
      - name: Python'u Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fiyat Takipçisini Çalıştır
        env:
          # Bu betik sadece Steam API anahtarına ihtiyaç duyar
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python daily_price_tracker.py

      - name: Veritabanı Değişikliklerini Commit'le ve Push'la
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions-bot@github.com'
          
          git add all_game.db
          
          # Eğer bir değişiklik varsa, o günün tarihini içeren bir mesajla commit at
          git diff --staged --quiet || git commit -m "Veri: Günlük fiyat takibi yapıldı - $(date -u +'%d-%m-%Y')"
          
          git push
