name: '2 - Günlük Fiyat Takipçisi'

on:
  workflow_dispatch: # Manuel çalıştırma butonu da olsun
  schedule:
    # Bu bir CRON zamanlamasıdır. "Her gün saat 02:00 UTC'de çalıştır" demek.
    # Türkiye saati ile yaklaşık sabah 5'ya denk gelir.
    - cron: '0 2 * * *'

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Checkout Yap
        uses: actions/checkout@v4

      - name: Python'u Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      # Bu betik sadece Steam API anahtarına ihtiyaç duyar
      - name: Fiyat Takipçisini Çalıştır
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python daily_price_tracker.py

      # Değişen veritabanını geri commit'le
      - name: Veritabanı Değişikliklerini Commit'le
        uses: jrkurban/git-auto-commit-action@v5
        with:
          commit_message: 'Veri: Günlük fiyat takibi yapıldı'
          file_pattern: 'all_game.db'
