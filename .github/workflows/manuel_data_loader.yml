# .github/workflows/1_manual_data_load.yml

name: '1 - Manuel Veri Yükleyici'

on:
  # Bu workflow'un sadece GitHub Actions sekmesinden manuel olarak
  # tetiklenebilmesini sağlar.
  workflow_dispatch:

permissions:
  # Bu iş akışının repository'ye kod yazma (commit/push) izni olduğunu belirtir.
  contents: write

jobs:
  load-initial-data:
    runs-on: ubuntu-latest

    steps:
      # 1. Adım: Repository'deki kodları sanal makineye indir
      - name: Kodları Checkout Yap
        uses: actions/checkout@v4

      # 2. Adım: Python 3.11 ortamını kur
      - name: Python'u Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Adım: Gerekli Python kütüphanelerini yükle
      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Adım: Ana veri yükleyici betiğini çalıştır
      - name: Veri Yükleyiciyi Çalıştır
        env:
          # GitHub Secrets'ı ortam değişkeni olarak betiğe güvenli bir şekilde aktar
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python initial_data_loader.py

      # 5. Adım: Değişen veritabanı dosyasını repository'ye geri commit'le
      - name: Veritabanı Değişikliklerini Commit'le ve Push'la
        run: |
          # Commit'i yapacak bot kullanıcısını yapılandır
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions-bot@github.com'
          
          # Sadece veritabanı dosyasını takibe al
          git add all_game.db
          
          # Eğer bir değişiklik varsa commit at (boş commit'leri engeller)
          git diff --staged --quiet || git commit -m "Veri: Veritabanı ilk veri yükleyici ile güncellendi"
          
          # Değişiklikleri ana dala (main/master) gönder
          git push
