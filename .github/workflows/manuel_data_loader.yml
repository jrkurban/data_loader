name: '1 - Manuel Veri Yükleyici'

# Bu workflow'un manuel olarak tetiklenmesini sağlar
on:
  workflow_dispatch:

jobs:
  build-database:
    runs-on: ubuntu-latest  # Sanal makine olarak Ubuntu kullan

    steps:
      # 1. Adım: Repository'deki kodları sanal makineye indir
      - name: Kodları Checkout Yap
        uses: actions/checkout@v4

      # 2. Adım: Python ortamını kur (örneğin Python 3.9)
      - name: Python'u Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Adım: Gerekli Python kütüphanelerini yükle
      - name: Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      # 4. Adım: Ana veri yükleyici betiğini çalıştır
      - name: Veri Yükleyiciyi Çalıştır
        env:
          # GitHub Secrets'ı ortam değişkeni olarak betiğe aktar
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python initial_data_loader.py

      # 5. Adım: Değişen veritabanı dosyasını repository'ye geri commit'le
      - name: Veritabanı Değişikliklerini Commit'le
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Veri: Veritabanı ilk veri yükleyici ile güncellendi'
          file_pattern: 'all_game.db' # Sadece bu dosyayı takip et
